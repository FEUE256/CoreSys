ROOT_DIR := ../../
SRC_DIR := $(abspath $(ROOT_DIR)src/CoreSys)
BUILD_DIR := $(abspath $(ROOT_DIR)build/CoreSys)
MODE := Debug
B_DIR := $(SRC_DIR)/bootloader
I_DIR := $(SRC_DIR)/init
K_DIR := $(SRC_DIR)/kernel
BIN_DIR := $(abspath $(ROOT_DIR)bin/$(MODE)/CoreSys)
BUILD_EFI := $(BIN_DIR)/BOOTX64.EFI
BUILD_I_EFI := $(BIN_DIR)/init.efi
BUILD_K_EFI := $(BIN_DIR)/kernel.efi
BUILD_I_EFI_NE := $(BIN_DIR)/init.re
BUILD_K_EFI_NE := $(BIN_DIR)/kernel.re
EDK2_MODE := $(MODE)
OUTPUT_DIR := $(abspath $(ROOT_DIR)bin/$(MODE)/CoreSys)
CC := x86_64-w64-mingw32-gcc
LD := x86_64-w64-mingw32-gcc
INC_DIR := $(SRC_DIR)/include
CF_STD := -Werror
INCLUDES := -I$(INC_DIR) -I$(INC_DIR)/EDK/MdePkg/Include -I$(INC_DIR)/EDK/MdePkg/Include/X64 -I$(INC_DIR)/EDK/MdeModulePkg/Include -I$(INC_DIR)/EDK/MdeModulePkg/Include/X64
B_CFLAGS := -std=c17 -Wall $(CF_STD) -Wextra -Wpedantic -ffreestanding -fshort-wchar -fno-exceptions -fno-asynchronous-unwind-tables -mno-red-zone -m64 -nostdlib $(INCLUDES) -fmax-errors=50
B_LDFLAGS := -nostdlib -T $(B_DIR)/bootloader.ld -Wl,--subsystem,10 -Wl,--image-base,0 -Wl,--emit-relocs -Wl,--section-alignment,4096 -Wl,--file-alignment,4096 -Wl,-entry,bmain -Wl,--allow-multiple-definition
K_CFLAGS := -std=c17 -Wall $(CF_STD) -Wextra -Wpedantic -ffreestanding -fshort-wchar -fno-exceptions -fno-asynchronous-unwind-tables -mno-red-zone -m64 -nostdlib $(INCLUDES) -I$(ROOT_DIR)src/CoreSys/kernel/ -mno-sse -mno-sse2 -mno-mmx -mno-avx -mno-avx2 -mno-80387 -mno-fp-ret-in-387
K_LDFLAGS := -nostdlib -T $(K_DIR)/kernel.ld -Wl,--subsystem,10 -Wl,--image-base,0 -Wl,--emit-relocs -Wl,--section-alignment,4096 -Wl,--file-alignment,4096 -Wl,-entry,kmain
SRCS := $(wildcard $(SRC_DIR)/*.c)
I_CFLAGS := -std=c17 -Wall $(CF_STD) -Wextra -Wpedantic -ffreestanding -fshort-wchar -fno-exceptions -fno-asynchronous-unwind-tables -mno-red-zone -m64 -nostdlib $(INCLUDES)
I_LDFLAGS := -nostdlib -T $(I_DIR)/init.ld -Wl,--subsystem,10 -Wl,--image-base,0 -Wl,--emit-relocs -Wl,--section-alignment,4096 -Wl,--file-alignment,4096 -Wl,-entry,imain
GPT_MODE := Release # The mode from the gpt.cfg file DO NOT ONLY THIS OR ONLY the MODE_GPT in gpt.cfg IF YOU WANT TO CHAGE, CHANGE BOTH ELSE YOU COME GET A BUILD ERROR!
NE_MODE := Release# (Do not add a space beween e and #) The mode from the ne.cfg file DO NOT ONLY THIS OR ONLY the MODE_NE in ne.cfg IF YOU WANT TO CHAGE, CHANGE BOTH ELSE YOU COME GET A BUILD ERROR!
NE_TOOL := $(ROOT_DIR)bin/$(NE_MODE)/NE/ne.run
GPT_TOOL = $(ROOT_DIR)bin/Release/GPT/write_gpt.run
GPT_IMG := $(BUILD_DIR)/CoreSys.img
GPT_FILE_TXT := $(BUILD_DIR)/FILE.TXT
FINAL_IMG_DIR := $(BIN_DIR)/CoreSys
FINAL_IMG := $(FINAL_IMG_DIR)/CoreSys.img
SCRIPTS_DIR := $(ROOT_DIR)scripts/VM
QEMU_SCRIPT := $(SCRIPTS_DIR)/qemu.sh
DIST_FOLDER := $(ROOT_DIR)dist
DIST_LOCATION := $(DIST_FOLDER)/CoreSys.img
B_MAKE := bootloader/Makefile
I_MAKE := init/Makefile
K_MAKE := kernel/Makefile
