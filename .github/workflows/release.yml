name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Download deps
        run: bash scripts/dev/apt.sh

      - name: Build (force rebuild)
        run: make -C build/master all -B

      - name: Verify artifacts
        run: |
          ls -lah dist/
          test -f dist/CoreSys.img
          test -f dist/CyberBoot.img
          test -f dist/cios.img
          test -f dist/db.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/CoreSys.img
            dist/CyberBoot.img
            dist/cios.img
            dist/db.exe

      - name: Cleanup build (after release)
        if: always()
        run: make -C build/master clean -B
        